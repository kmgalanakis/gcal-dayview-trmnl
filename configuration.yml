---
version: 0.80.0
name: google_calendar_ical_timeline_kindle
label: Google Calendar Day View (iCal) - Kindle
description: Today's agenda from your Google Calendar secret iCal address, with repeating
  events expanded.
mode: text
kind: poll
tags:
- calendar
- google
static_body:
fields:
- name: Secret iCal address
  default: https://calendar.google.com/calendar/ical/REPLACE_ME/private-REPLACE_ME/basic.ics
  keyname: ical_url
  field_type: url
  description: Google Calendar → Settings → your calendar → Integrate calendar → Secret
    address in iCal format. Separate several with a space (max 3).
- name: Timezone
  default: Europe/Athens
  keyname: timezone
  field_type: string
  description: IANA name, e.g. Europe/Athens.
- name: Clock
  default: 24h
  keyname: clock
  options:
  - 24h
  - 12h
  field_type: select
- name: Locale
  default: en-GB
  keyname: locale
  field_type: string
  description: For the weekday and month names, e.g. en-GB or el-GR.
- name: Max events in the list
  default: 7
  keyname: max_events
  field_type: number
- name: Hide timed events marked Free
  default: 'no'
  keyname: hide_free
  options:
  - 'no'
  - 'yes'
  field_type: select
- name: Hide events
  default: ''
  keyname: hide_titles
  field_type: string
  description: Comma separated. Hides every event whose title contains one of these
    phrases, e.g. Core working hours, Lunch. Case does not matter.
- name: Title bar text
  default: Google Calendar
  keyname: title
  field_type: string
- name: Layout
  default: timeline
  keyname: layout
  options:
  - agenda
  - timeline
  - focus
  field_type: select
  description: agenda = now/next cards and a list; timeline = hour slots like Google
    Calendar's day view; focus = a big countdown to the next meeting above the day
    view.
- name: Timeline first hour
  default: 9
  keyname: day_start
  field_type: number
  description: Earlier events stretch the grid automatically.
- name: Timeline last hour
  default: 18
  keyname: day_end
  field_type: number
  description: Later events stretch the grid automatically.
- name: Calendar names
  default: Work, Personal
  keyname: calendar_names
  field_type: string
  description: Comma separated, in the same order as the iCal URLs. Shown in the day
    view legend.
- name: Calendar styles
  default: solid, outline, striped
  keyname: calendar_styles
  field_type: string
  description: Comma separated, one per iCal URL. Options are solid, outline or striped.
- name: Your emails (for declined events)
  default: ''
  keyname: my_email
  field_type: string
  description: Optional. One or more addresses, separated by spaces. When empty, taken
    from every iCal address.
data:
  values:
    clock: 24h
    title: Google Calendar
    layout: timeline
    locale: en-GB
    day_end: 22
    ical_url: https://calendar.google.com/calendar/ical/REPLACE_ME/private-REPLACE_ME/basic.ics
    timezone: Europe/Athens
    day_start: 9
    hide_free: 'no'
    max_events: 15
    calendar_names: Work, Personal
    calendar_styles: solid, outline, striped
interval: 15
unit: minute
days: []
last_day_of_month: false
start_at: '2026-11-08T22:00:00+00:00'
exchanges:
- headers:
    accept: text/calendar
  verb: get
  body:
  template: "{{ extension.values.ical_url }}"
- headers:
    accept: text/plain
  verb: get
  body:
  template: "{{ extension.values.ical_url }}"
